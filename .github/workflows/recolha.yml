name: recolha

# Sem agendamento desde 2026-10-27, por decisao do autor. Com o historico
# consolidado, cada entrevista nova entra a mao pelo formulario
# `adicionar`, que publica sozinho, e a Metodologia diz isso por
# palavras: a pesquisa automatica deixou de correr. Um cron de volta
# publicaria todas as manhas linhas que ninguem leu, e a Metodologia
# passava a afirmar uma coisa falsa sem nenhum erro a avisar. Ha teste.
#
# Fica a corrida a pedido, para manutencao. Voltar a agendar isto obriga
# a reescrever a seccao "De onde vem os numeros" da Metodologia na mesma
# operacao.
#
# Saiu tambem o job `porta`: so existia para escolher, das duas entradas
# do cron, a que caia nas 06:00 de Lisboa, e numa corrida a pedido
# deixava passar sempre.
on:
  workflow_dispatch:

permissions:
  contents: write

# Um so escritor em docs/dados de cada vez.
concurrency:
  group: recolha
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # A suite corre antes da recolha: uma regressao no criterio nunca
      # chega a escrever dados. Inclui a verificacao de que a Metodologia
      # publicada e os textos do site correspondem aos ficheiros fonte.
      - name: Testes Python
        run: python -m unittest discover -s tests -t .

      - name: Testes da logica do site
        run: node --test tests/frontend/*.test.js

      # Duas rondas no mesmo dia, mas so quando a primeira encontra algo.
      #
      # A confirmacao em rondas existe para apanhar um erro passageiro de
      # leitura: uma pagina truncada, um campo malformado nesse dia. Uma
      # segunda leitura completa, minutos depois, apanha essa classe de
      # erro na mesma, e permite publicar no proprio dia em vez de no dia
      # seguinte. Continua a nao proteger de a fonte estar errada, que e
      # coisa que releitura nenhuma protege.
      #
      # A segunda leitura e mais proxima da primeira do que uma leitura no
      # dia seguinte, por isso apanha menos: um site que sirva uma pagina
      # partida a manha inteira engana as duas. E o preco de publicar no
      # dia, e esta escrito na Metodologia.
      #
      # Sem nada a espera de confirmacao, a segunda ronda nao teria nada
      # para confirmar e nao se corre: sao menos pedidos aos canais e ao
      # motor de busca em cada corrida sem nada por confirmar.
      - name: Recolher, primeira ronda
        run: python -m recolha.principal --ronda "$(date -u +%Y-%m-%d)-r1" --estado estado.json

      - name: Recolher, segunda ronda se houver algo por confirmar
        run: |
          por_confirmar=$(python -c "import json; print(json.load(open('estado.json'))['por_confirmar'])")
          echo "por confirmar depois da primeira ronda: $por_confirmar"
          if [ "$por_confirmar" -gt 0 ]; then
            python -m recolha.principal --ronda "$(date -u +%Y-%m-%d)-r2"
          else
            echo "nada por confirmar, nao ha segunda ronda"
          fi
          rm -f estado.json

      # Os numeros que os motores de pesquisa e os agentes de recolha dos
      # modelos de linguagem leem vivem dentro do HTML, porque nenhum
      # deles executa o JavaScript que constroi as paginas. Tem de ser
      # reescritos na mesma corrida que escreve os dados: um HTML com os
      # numeros de ontem e pior do que nenhum, e o teste `test_seo` trava
      # a recolha do dia seguinte se isto nao correr.
      - name: Actualizar o que os motores leem
        run: python -m ferramentas.gerar_seo

      - name: Publicar
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "sem alteracoes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "dados: recolha de $(date -u +%Y-%m-%d)"
          # O push pode chegar depois de outro commit ter avancado o main.
          # Sem retentativa, a recolha ficava perdida na maquina da CI.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejeitado, a tentar rebase (tentativa $i/5)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 3))
          done
          echo "nao foi possivel publicar depois de 5 tentativas" >&2
          exit 1
