name: adicionar

# O formulario para acrescentar entrevistas, uma ou varias. Pedido do
# autor a 2026-10-12: dar o dia, o canal e a ligacao, e a entrevista
# aparecer no site, sem patch, sem PowerShell e sem disparar a recolha
# inteira.
#
# Preenche-se em Actions, "adicionar", "Run workflow", tambem no
# telemovel. Uma entrada e o dia, o canal e a ligacao, por qualquer ordem;
# varias separam-se por ponto e virgula, porque a caixa e de uma linha so
# e o browser apaga as mudancas de linha de um texto colado. Tudo ou nada:
# se uma entrada falha, nenhuma e escrita. Ver ferramentas/adicionar.py.
#
# O canal e o dia sao a leitura de quem preenche, como em todo o
# `config/curadoria.yml`, e e isso que da a esta via a isencao da prova de
# formato e das rondas.
on:
  workflow_dispatch:
    inputs:
      entradas:
        description: 'Dia, canal e ligacao. Varias: separar com ; (ex.: 2026-10-05 NOW https://... ; 08-10-2026 CMTV https://...)'
        required: true
        type: string

permissions:
  contents: write

# Sem grupo de concorrencia, de proposito. Um grupo do GitHub guarda uma
# so corrida pendente e cancela a anterior: tres formularios seguidos
# perdiam o do meio. Em vez disso, cada tentativa parte do `main` acabado
# de ler e refaz tudo, e um push rejeitado recomeca do inicio.
#
# O custo, dito: se um formulario publicar durante uma corrida a pedido
# da `recolha` ou do `historico`, essa corrida pode falhar o rebase e nao
# publicar. Nada se perde para sempre, porque o dataset e append-only e a
# corrida seguinte volta a ver o mesmo; a curadoria nunca se perde,
# porque esta no `config`. A recolha deixou de ser agendada a 2026-10-27.
jobs:
  adicionar:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Os campos entram por variaveis de ambiente e nunca escritos dentro
      # do script: um `${{ }}` dentro de `run` e texto colado no shell, e
      # uma ligacao com aspas ou `$(...)` correria como comando. Ha teste.
      - name: Acrescentar e publicar
        shell: bash
        env:
          ENTRADAS: ${{ inputs.entradas }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Recusa sem escrever nada se alguma linha nao serve; o motivo
            # de cada uma fica no resumo da corrida.
            python -m ferramentas.adicionar --entradas "$ENTRADAS" || exit 1
            # A mesma barreira da recolha: uma regressao nunca chega
            # a escrever dados.
            python -m unittest discover -s tests -t . || exit 1
            node --test tests/frontend/*.test.js || exit 1
            # So a curadoria: sem rede, em menos de um segundo (medido a
            # 2026-10-12, 0,4 s). As outras fontes so correm quando a
            # `recolha` e disparada a mao, e a quarentena delas fica como
            # estava.
            python -m recolha.principal --fonte curadoria --ronda "adicionar-$(date -u +%Y-%m-%dT%H%M%S)" | tee saida.txt
            grep -E "entrevistas exclusivas publicadas|retiradas por veto" saida.txt >> "$GITHUB_STEP_SUMMARY" || true
            rm -f saida.txt
            python -m ferramentas.gerar_seo
            git add config/curadoria.yml docs
            git commit -q -m "curadoria: acrescenta entrevistas pelo formulario"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejeitado, a refazer a partir do main (tentativa $i/5)"
            sleep $((i * 3))
          done
          echo "nao foi possivel publicar depois de 5 tentativas" >&2
          exit 1
