name: adicionar

# O formulario para acrescentar uma entrevista. Pedido do autor a
# 2026-10-12: dar o dia, o canal e a ligacao, e a entrevista aparecer no
# site, sem patch, sem PowerShell e sem disparar a recolha inteira.
#
# Preenche-se em Actions, "adicionar", "Run workflow", tambem no
# telemovel. Demora cerca de um minuto ate ao commit (estimativa, nao
# medida), mais o tempo de publicacao do GitHub Pages.
#
# O canal e o dia sao a leitura de quem preenche, como em todo o
# `config/curadoria.yml`, e e isso que da a esta via a isencao da prova de
# formato e das rondas. Ver ferramentas/adicionar.py.
on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Dia em que a entrevista passou (AAAA-MM-DD, AAAAMMDD ou DD-MM-AAAA)'
        required: true
        type: string
      canal:
        description: 'Canal'
        required: true
        type: choice
        # Os mesmos ids de config/porquinho.yml, pela mesma ordem. Ha teste
        # que falha se as duas listas se afastarem.
        options:
          - rtp1
          - rtp2
          - sic
          - tvi
          - sic-noticias
          - rtp3
          - cnn-portugal
          - now
          - cmtv
      prova:
        description: 'Ligacao da prova (a publicacao, a pagina do canal ou a noticia)'
        required: true
        type: string

permissions:
  contents: write

# Sem grupo de concorrencia, de proposito. Um grupo do GitHub guarda uma
# so corrida pendente e cancela a anterior: tres formularios seguidos
# perdiam o do meio. Em vez disso, cada tentativa parte do `main` acabado
# de ler e refaz tudo, e um push rejeitado recomeca do inicio.
#
# O custo, dito: se um formulario publicar durante a recolha das 06:00, a
# recolha pode falhar o rebase e perder essa manha. Nada se perde para
# sempre, porque o dataset e append-only e a recolha seguinte volta a ver
# o mesmo; a curadoria nunca se perde, porque esta no `config`.
jobs:
  adicionar:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Os campos entram por variaveis de ambiente e nunca escritos dentro
      # do script: um `${{ }}` dentro de `run` e texto colado no shell, e
      # uma ligacao com aspas ou `$(...)` correria como comando. Ha teste.
      - name: Acrescentar e publicar
        env:
          DATA: ${{ inputs.data }}
          CANAL: ${{ inputs.canal }}
          PROVA: ${{ inputs.prova }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Recusa sem escrever nada se a linha nao serve; o motivo fica
            # no resumo da corrida.
            python -m ferramentas.adicionar --data "$DATA" --canal "$CANAL" --prova "$PROVA" || exit 1
            # A mesma barreira da recolha diaria: uma regressao nunca chega
            # a escrever dados.
            python -m unittest discover -s tests -t . || exit 1
            node --test tests/frontend/*.test.js || exit 1
            # So a curadoria: sem rede, em menos de um segundo (medido a
            # 2026-10-12, 0,4 s). As outras fontes continuam a correr as
            # 06:00, e a quarentena delas fica como estava.
            python -m recolha.principal --fonte curadoria --ronda "adicionar-$(date -u +%Y-%m-%dT%H%M%S)"
            python -m ferramentas.gerar_seo
            git add config/curadoria.yml docs
            git commit -q -m "curadoria: acrescenta $CANAL $DATA"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejeitado, a refazer a partir do main (tentativa $i/5)"
            sleep $((i * 3))
          done
          echo "nao foi possivel publicar depois de 5 tentativas" >&2
          exit 1
