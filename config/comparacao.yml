---
# Pagina de comparacao: as entrevistas exclusivas de outras duas pessoas,
# contadas com as regras do resto do site, ao lado das do sujeito.
#
# De onde vem: um levantamento pontual feito por pesquisa, fechado a
# 2026-10-30, e confirmado a 2026-11-06 abrindo cada prova no browser.
# NAO vem da recolha que construiu o historico do sujeito. Por isso os
# numeros destas duas pessoas sao minimos, e a pagina diz isso.
#
# Quem le isto: `ferramentas/comparacao.py`, chamado pelo `gerar_seo`.
# Todos os workflows que escrevem dados ja correm o `gerar_seo`, por isso
# a pagina acompanha sozinha qualquer entrevista nova do sujeito. Depois
# de mexer neste ficheiro a mao, correr `python -m ferramentas.gerar_seo`
# e commitar o `docs/comparacao.html` regenerado.
#
# Regras, cada uma com a razao:
#
# - So conta `estado: confirmada`. `por_verificar` fica aqui com o motivo,
#   para a decisao ficar registada, e nao entra em numero nenhum: "nao
#   sei" nao e "sim". `fora_do_ambito` nunca entra (antes de 2024, ou um
#   canal fora dos nove).
# - Uma confirmada tem de ter `canal` (id de config/porquinho.yml) e
#   `prova` (endereco publico que nomeia o canal e fixa o dia).
# - Uma entrevista que passou em dois canais e UMA linha, com o canal a
#   que fica atribuida em `canal` e os outros em `tambem_em`. Conta uma
#   vez, como no resto do site.
# - Uma confirmada depois de `janela.ate` faz falhar o gerador: quem
#   acrescenta uma entrevista nova tem de mover tambem a data de fecho,
#   senao a linha ficava no ficheiro sem contar e ninguem dava por isso.
# - O programa fica so na `nota`. A pagina mostra o canal, nunca o
#   programa, como a de Fontes desde 2026-10-21.
#
# Decisoes do autor a 2026-11-06: pagina nova no menu; satira so sobre o
# porquinho, as outras duas pessoas em tom factual; o site oficial de um
# partido vale como prova, pela mesma razao por que vale a conta do
# proprio entrevistado. Mais tarde no mesmo dia: todas as entrevistas do
# sujeito desde 2024 a vista, numa linha do tempo comum, com a faixa de
# quem entrou mais tarde riscada antes da entrada; o numero contra numero
# so no periodo comum, porque tres anos de uma pessoa nao se comparam com
# ano e meio de outra.

versao: 1

# `desde` e o inicio do periodo comum: o dia em que a pessoa mais recente
# no cargo o assumiu. So ai se compara numero contra numero. Acaba no ultimo dia ate
# onde se procuraram as entrevistas das outras duas pessoas. O sujeito e
# contado ate ao mesmo dia: sem isso, o numero dele continuava a crescer
# com cada entrevista nova e o das outras ficava parado, e o contraste
# crescia sozinho.
#
# Fecho: o levantamento fechou a 2026-10-30; a 2026-11-06 uma pesquisa
# dirigida a 31 out a 6 nov nao encontrou nenhuma entrevista das duas
# pessoas nos nove canais (so a da Euronews, registada abaixo como fora do
# ambito, e uma declaracao ao pais, que nao e entrevista). Com o fecho no
# mesmo dia da pagina inicial, o numero do sujeito aqui sao todas as
# entrevistas dele desde o inicio da janela.
janela:
  desde: 2025-06-28
  ate: 2026-11-06

sujeito:
  cargo: presidente do Chega

# `desde`: a partir de quando a pessoa entra nas contagens. Quem entra
# depois do inicio do site (2024-01-01) tem `marco` (a frase da linha do
# tempo nesse dia), `antes` (o que a faixa riscada diz) e, opcional,
# `desde_texto` (o que o cartao acrescenta a data). A `nota` e so para
# quem le este ficheiro.
pessoas:
  - id: montenegro
    nome: Luís Montenegro
    cargo: primeiro-ministro, PSD
    desde: 2024-01-01
    nota: >-
      Prova independente do zero na janela comum, acrescentada a
      2026-11-06: o SOL de 18 set 2026 escreve que a última entrevista
      formal do primeiro-ministro a uma televisão ou rádio foi a da RTP,
      em junho de 2025, em Bruxelas (a de 2025-06-25 abaixo). Limites do
      artigo: só conta entrevistas formais, por isso não cobre programas
      de entretenimento; refere uma entrevista à Antena 1 em julho de
      2025, que é rádio e aqui não conta; e não cobre de 18 set a 30 out
      2026, intervalo em que a pesquisa de 2026-11-06 também não encontrou
      nenhuma.
      https://sol.iol.pt/politica/noticias/montenegro-impoe-regras-ao-estilo-de-trump/20260918/6aac587a0cf23b0ed4fd8bb2
  - id: carneiro
    nome: José Luís Carneiro
    cargo: secretário-geral do PS
    desde: 2025-06-28
    marco: José Luís Carneiro passa a liderar o PS
    antes: ainda não liderava o PS
    desde_texto: quando passou a liderar o PS

# Rotulo da ligacao na tabela das provas. A pagina diz que tipo de prova
# e, para quem le saber, antes de abrir, que uma linha assenta no site de
# um partido.
rotulos_de_prova:
  canal: ver
  video: ver
  imprensa: notícia
  anuncio: anúncio
  partido: site do partido

textos:
  titulo: Entrevistas exclusivas na televisão portuguesa
  periodo: '{desde} a {ate}'
  intro: >-
    Todas as do porquinho desde que o site conta, ao lado das do
    primeiro-ministro e do secretário-geral do PS, com as mesmas regras e
    os mesmos nove canais.
  desde_cartao: desde {data}
  # O ritmo mede so o ultimo ano ate ao fecho (ver ferramentas/comparacao.py).
  # Com o fecho a 2026-11-06: porquinho uma a cada 9 dias (13 desde 2024),
  # Carneiro uma a cada 19 (20 desde que entrou), Montenegro nenhuma
  # (12 desde 2024, todas antes de 26 de junho de 2025).
  ritmo: uma a cada {dias} dias no último ano
  ritmo_zero: nenhuma no último ano
  ritmo_nota: >-
    O ritmo conta só o último ano, de {desde} a {ate}, igual para os três.
    Medido desde o início, ficava datado e enviesado: períodos de tamanho
    diferente para cada um, e meses antigos a pesar tanto como os de agora.
  linha_titulo: Mês a mês
  linha_legenda: Cada quadrado é uma entrevista exclusiva, no mês em que passou.
  janela_titulo: 'No mesmo período, de {desde} a {ate}'
  frase_razao: Por cada entrevista de {nome}, o porquinho deu {razao}.
  frase_zero: '{nome} não deu nenhuma.'
  frase_empate: '{nome} deu {n}, tantas ou mais do que o porquinho.'
  remate: Onde há lama, há câmaras.
  provas_titulo: As provas dos outros dois
  provas_legenda: >-
    Cada linha tem a ligação que prova o canal e o dia. As do porquinho
    estão na {fontes}.
  metodo_titulo: Como se contou
  metodo:
    - >-
      Cada um conta desde que o site conta, {inicio}, ou desde que assumiu
      o cargo, e todos até {ate}. Os totais cobrem períodos diferentes e
      por isso não se comparam entre si: o ritmo mede os três no último
      ano, desde {ano}, e a comparação número contra número faz-se só no
      período comum, desde {desde}.
    - >-
      Com as regras do resto do site: entrevista exclusiva, informativa ou
      de entretenimento, num dos nove canais, com uma prova pública que
      nomeia o canal e fixa o dia. Uma entrevista que passou em dois
      canais conta uma vez.
    - >-
      Os números do primeiro-ministro e do secretário-geral do PS vêm de
      um levantamento feito para esta página e confirmado prova a prova,
      com as entrevistas procuradas até {ate}. Não vêm da recolha que
      construiu o histórico do porquinho, e por isso são mínimos: uma
      entrevista que ninguém encontrou não entra. Para estes dois, vale
      também como prova uma publicação no site oficial do partido, pela
      mesma razão por que vale a conta do próprio entrevistado.
  por_verificar: >-
    Ficaram de fora, por falta de uma prova que fixe o dia e o canal: {k}.
    Entram se essa prova aparecer.

